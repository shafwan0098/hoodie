<script>
const $=s=>document.querySelector(s),money=n=>'৳'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const mk=(id,name,price,badge='none')=>({id,name,price,sale:null,disc:0,badge,active:true,avail:true,stock:Object.fromEntries(CLR.flatMap(c=>SZ.map(s=>[c[0]+'_'+s,12])))});
let D={settings:{inside:80,outside:130,free:5000,ann:'FREE DELIVERY ON ORDERS OVER ৳5,000',footer:'Premium heavyweight streetwear designed in Bangladesh.'},
codes:[{code:'SHAFWAN10',type:'percent',value:10,active:true}],
sizes:[{s:'S',l:68,c:58,sh:52,sl:62},{s:'M',l:70,c:60,sh:54,sl:63},{s:'L',l:72,c:62,sh:56,sl:64},{s:'XL',l:74,c:64,sh:58,sl:65},{s:'XXL',l:76,c:66,sh:60,sl:66}],
products:[mk('essential-hoodie','Essential Hoodie',2990),mk('oversized-core-hoodie','Oversized Core Hoodie',3490,'new'),mk('shadow-hoodie','Shadow Hoodie',3990),mk('signature-hoodie','Signature Hoodie',4490),mk('heavyweight-hoodie','Heavyweight Hoodie',4290,'new'),mk('ghost-hoodie','Ghost Hoodie',3190)]};
let db=null,owner=false,cart=[],sel={},last=null,tab='orders',q='',IMG={},OS=[],ready=false,listening=false,fl='all',sv=null,saving=false,nTm=null,uid=null,known=new Set(),diag='';
try{cart=JSON.parse(localStorage.getItem('shf_cart')||'[]')}catch(e){}
const norm=()=>D.products.forEach(p=>{if(p.avail===undefined)p.avail=true;if(p.disc===undefined)p.disc=p.sale&&p.sale<p.price?Math.round((1-p.sale/p.price)*100):0});norm();
const P=id=>D.products.find(p=>p.id===id),pr=p=>p.sale&&p.sale<p.price?p.sale:p.price,stk=(p,c,s)=>p.avail===false?0:(p.stock[c+'_'+s]||0),left=p=>p.avail===false?0:Object.values(p.stock).reduce((a,b)=>a+b,0);

const pic=(p,i=0,c='Black',k='')=>{const u=(IMG[p.id]||[])[i];return u?`<img class="${k}" src="${u}" alt="${esc(p.name)}" loading="lazy">`:art(hex(c),k)};

const chrome=()=>{$('#ann').textContent=D.settings.ann||'';$('#ann').hidden=!D.settings.ann;$('#ft').textContent=D.settings.footer||'';$('#shipinfo').textContent=`Inside Dhaka ${money(D.settings.inside)} · Outside Dhaka ${money(D.settings.outside)}`+(D.settings.free?` · Free over ${money(D.settings.free)}`:'')};

<div class="meta"><h3>${esc(p.name)}</h3><div class="pr"><b>${money(pr(p))}</b>${pc?`<s>${money(p.price)}</s><em>${pc}% OFF</em>`:''}</div><div class="sw">${CLR.map(c=>`<i class="dot" style="background:${c[1]}" title="${c[0]}"></i>`).join('')}<span>${SZ.join(' ')}</span></div></div></article>`}

$('#app').innerHTML=`<div class="w"><div class="hero"><div><h1>Not loud.<br>Unmistakable.</h1><p>Heavyweight essentials for people who move differently.</p><div class="cta"><a class="btn" href="#/shop">Shop collection</a><a class="btn o" href="#/about">Explore Shafwan’s</a></div></div><div class="hv">${art('#0B0B0C')}</div></div></div>
<section id="shop"><div class="w"><div class="sh"><h2>The Collection</h2><input id="q" placeholder="Search hoodies" value="${esc(q)}" aria-label="Search"></div><div class="grid" id="g">${l.map(card).join('')||'<p>No hoodies match your search.</p>'}</div></div></section>

<section id="about"><div class="w ab"><h2>Quiet<br>confidence.<br>Strong identity.</h2><p>Shafwan’s is premium heavyweight streetwear designed in Bangladesh. Minimal pieces, considered fits, nothing shouting. Find your size in the <a data-act="size" style="text-decoration:underline;cursor:pointer">size guide</a>, then order with cash on delivery.</p></div></section>`;
const i=$('#q');i.oninput=()=>{q=i.value.toLowerCase();$('#g').innerHTML=D.products.filter(p=>p.active&&p.name.toLowerCase().includes(q)).map(card).join('')||'<p>No hoodies match your search.</p>'}}
function sizeHtml(){return `<div class="in" style="padding:32px"><h2 style="font-size:30px;margin-bottom:16px">Size guide</h2><div style="overflow-x:auto"><table><tr><th>SIZE</th><th>LENGTH</th><th>CHEST</th><th>SHOULDER</th><th>SLEEVE</th></tr>${D.sizes.map(r=>`<tr><td><b>${r.s}</b></td><td>${r.l} cm</td><td>${r.c} cm</td><td>${r.sh} cm</td><td>${r.sl} cm</td></tr>`).join('')}</table></div><h3 style="font-size:16px;margin:24px 0 8px">How to measure</h3><p style="color:var(--mut)">Lay a hoodie you own flat. Chest: across the widest part under the armpits. Length: from the top of the shoulder to the hem. Shoulder: seam to seam. Sleeve: from shoulder seam to cuff. Between sizes? Size up for an oversized fit.</p></div>`}
const modal=h=>{$('#modal').innerHTML=`<div class="box"><button class="x" data-act="close" aria-label="Close">×</button>${h}</div>`;$('#modal').classList.add('on');$('#ov').classList.add('on')};
function prod(){const p=P(sel.id),c=sel.color,s=sel.size,n=s?stk(p,c,s):null,pc=p.sale&&p.sale<p.price?Math.round((1-p.sale/p.price)*100):0,im=IMG[p.id]||[];
const msg=left(p)<1?'Sold out':n===null?'Select a size':n<1?'Sold out in this size':n<=3?`Only ${n} left`:'In stock';
modal(`<div class="pd"><div class="im">${im.length?`<img class="m" src="${im[sel.img||0]||im[0]}" alt="${esc(p.name)}">${im.length>1?`<div class="th">${im.map((u,k)=>`<button class="${k===(sel.img||0)?'s':''}" data-act="timg" data-v="${k}" aria-label="Photo ${k+1}"><img src="${u}" alt=""></button>`).join('')}</div>`:''}`:art(hex(c))}</div><div class="in"><h2 style="font-size:28px">${esc(p.name)}</h2><div class="pr"><b style="font-size:20px">${money(pr(p))}</b>${pc?`<s>${money(p.price)}</s><em>${pc}% OFF</em>`:''}</div><p style="color:var(--mut)">Heavyweight essentials for people who move differently.</p>
<div class="lbl">COLOR — ${c}</div><div class="opt">${CLR.map(x=>`<button class="c ${x[0]===c?'s':''}" style="background:${x[1]}" data-act="color" data-v="${x[0]}" aria-label="${x[0]}"></button>`).join('')}</div>
<div class="lbl">SIZE · <a data-act="size2" style="text-decoration:underline;cursor:pointer">SIZE GUIDE</a></div><div class="opt">${SZ.map(z=>`<button class="${z===s?'s':''}" ${stk(p,c,z)<1?'disabled':''} data-act="sz" data-v="${z}">${z}</button>`).join('')}</div>
<div class="lbl">QUANTITY</div><div class="opt"><div class="qty"><button data-act="mq" data-v="-1">−</button><span>${sel.qty}</span><button data-act="mq" data-v="1">+</button></div></div>
<p class="lbl" id="av">${msg.toUpperCase()}</p><div class="err" id="pe"></div><button class="btn full" data-act="add" ${left(p)<1?'disabled':''}>${left(p)<1?'Sold out':'Add to cart'}</button><button class="btn o full" style="margin-top:8px" data-act="buy" ${left(p)<1?'disabled':''}>Buy now</button></div></div>`)}
function addItem(){const p=P(sel.id);if(!sel.size){$('#pe').textContent='Please select a size.';return false}
const k=cart.find(i=>i.pid===p.id&&i.color===sel.color&&i.size===sel.size),have=stk(p,sel.color,sel.size),nq=(k?k.qty:0)+sel.qty;
if(nq>have){$('#pe').textContent=`Only ${have} available in this size.`;return false}
k?k.qty=nq:cart.push({pid:p.id,color:sel.color,size:sel.size,qty:sel.qty});saveCart();return true}
function drawer(msg){const t=tot();$('#drawer').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:22px">Your cart</h2><button class="x" style="position:static" data-act="close">×</button></div>${msg?`<p style="color:var(--acc);font-weight:600">✓ Added to cart</p>`:''}
<div style="flex:1;overflow:auto">${cart.length?cart.map((i,n)=>{const p=P(i.pid);return `<div class="ci"><div class="t">${pic(p,0,i.color)}</div><div><b>${esc(p.name)}</b><div style="color:var(--mut);font-size:13px">${i.color} · ${i.size}</div><div class="qty" style="margin-top:6px"><button data-act="cq" data-i="${n}" data-v="-1">−</button><span>${i.qty}</span><button data-act="cq" data-i="${n}" data-v="1">+</button></div></div><div style="text-align:right"><b>${money(pr(p)*i.qty)}</b><br><a data-act="rm" data-i="${n}" style="font-size:12px;color:var(--mut);cursor:pointer;text-decoration:underline">Remove</a></div></div>`}).join(''):'<p style="margin-top:40px;text-align:center;color:var(--mut)">Your cart is empty.</p>'}</div>
${cart.length?`<div class="row tt"><span>Subtotal</span><span>${money(t.sub)}</span></div><p style="font-size:12px;color:var(--mut)">Delivery and discounts calculated at checkout.</p><a class="btn full" href="#/checkout" data-act="close">Checkout</a>`:`<a class="btn full" href="#/shop" data-act="close">Shop collection</a>`}`;$('#drawer').classList.add('on');$('#ov').classList.add('on')}
function checkout(){if(!cart.length){$('#app').innerHTML=`<div class="w" style="padding:100px 0;text-align:center"><h2 style="font-size:40px">Your cart is empty</h2><p style="color:var(--mut)">Add a hoodie to get started.</p><a class="btn" href="#/shop">Shop collection</a></div>`;return}
$('#app').innerHTML=`<div class="w co"><form id="cf" novalidate><h1 style="font-size:36px;margin-bottom:20px">Checkout</h1><div class="f"><div class="full"><label>FULL NAME</label><input name="name" autocomplete="name"></div><div><label>PHONE</label><input name="phone" inputmode="tel" placeholder="01XXXXXXXXX" autocomplete="tel"></div><div><label>EMAIL (FOR ORDER CONFIRMATION)</label><input name="email" type="email" autocomplete="email"></div><div><label>DISTRICT</label><input name="district"></div><div><label>AREA</label><input name="area"></div><div class="full"><label>FULL ADDRESS</label><textarea name="address" rows="2"></textarea></div><div class="full"><label>DELIVERY INSTRUCTIONS (OPTIONAL)</label><input name="notes"></div>
<div class="full"><label>DELIVERY</label><select name="zone"><option value="inside">Inside Dhaka — ${money(D.settings.inside)}</option><option value="outside">Outside Dhaka — ${money(D.settings.outside)}</option></select></div><div class="full"><label>PAYMENT</label><input value="Cash on delivery" disabled></div></div><div class="err" id="ce"></div><button class="btn full" style="margin-top:12px" id="po">Place order</button></form>
<div class="sum"><h3 style="margin-bottom:12px">Order summary</h3>${cart.map(i=>{const p=P(i.pid);return `<div class="row"><span>${esc(p.name)} · ${i.color} · ${i.size} × ${i.qty}</span><span>${money(pr(p)*i.qty)}</span></div>`}).join('')}<div style="display:flex;gap:8px;margin:12px 0"><input id="dc" placeholder="Discount code" style="text-transform:uppercase"><button class="btn o" type="button" id="ap" style="padding:0 16px">Apply</button></div><div id="tt"></div></div></div>`;
const f=$('#cf'),calc=()=>{const t=tot(f.zone.value,$('#dc').value);$('#tt').innerHTML=`<div class="row"><span>Subtotal</span><span>${money(t.sub)}</span></div><div class="row"><span>Delivery</span><span>${t.f?money(t.f):'Free'}</span></div><div class="row"><span>Discount${t.c?' ('+t.c.code+')':''}</span><span>−${money(t.d)}</span></div><div class="row tt"><span>TOTAL</span><span>${money(t.t)}</span></div>`;return t};calc();f.zone.onchange=calc;$('#ap').onclick=()=>{const t=calc();$('#ce').textContent=$('#dc').value&&!t.c?'That discount code is not valid.':''};
f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),er=$('#ce');
if(!v.name.trim()||!/^(\+?88)?01[3-9]\d{8}$/.test(v.phone.trim())||!v.district.trim()||!v.address.trim()){er.textContent='Please enter your name, a valid Bangladesh mobile number, district and full address.';return}
if(v.email&&!/^\S+@\S+\.\S+$/.test(v.email)){er.textContent='Please enter a valid email.';return}
const t=tot(v.zone,$('#dc').value),id='SHF-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6),b=$('#po');
for(const i of cart){if(stk(P(i.pid),i.color,i.size)<i.qty){er.textContent='Some items just sold out. Please update your cart.';return}}
const o={id,uid,at:Date.now(),status:'pending',emailed:false,ded:false,name:v.name.trim(),phone:v.phone.trim(),email:v.email.trim(),district:v.district.trim(),area:v.area.trim(),address:v.address.trim(),notes:v.notes.trim(),zone:v.zone,code:t.c?t.c.code:'',sub:t.sub,d:t.d,f:t.f,t:t.t,pay:'Cash on delivery',items:cart.map(i=>({n:P(i.pid).name,pid:i.pid,color:i.color,size:i.size,qty:i.qty,price:pr(P(i.pid))}))};
b.disabled=true;b.textContent='Placing order…';er.textContent='';
try{if(!db||!uid)throw 0;const rf=db.doc('orders/'+uid),cu=await rf.get(),m=cu.exists?((cu.data()||{}).orders||{}):{};m[id]=o;await rf.set({uid,orders:m})}catch(x){er.textContent='We could not place your order. Please check your connection and try again.';b.disabled=false;b.textContent='Place order';return}
last=o;cart=[];saveCart();location.hash='#/done'}}
function done(){const o=last;if(!o){location.hash='#/';return}$('#app').innerHTML=`<div class="w" style="max-width:720px;padding:80px 16px"><h1 style="font-size:clamp(34px,7vw,64px);font-weight:900">Order placed</h1><p style="color:var(--mut)">Thank you for shopping with Shafwan’s. We have received your order and will confirm it${o.email?' by email and ':' '}by phone shortly. Please save your order ID.</p><div class="sum" style="position:static"><div class="row"><span>Order ID</span><b>${esc(o.id)}</b></div><div class="row"><span>Name</span><span>${esc(o.name)}</span></div><div class="row"><span>Phone</span><span>${esc(o.phone)}</span></div><div class="row"><span>Address</span><span style="text-align:right">${esc(o.address)}, ${esc(o.area)} ${esc(o.district)}</span></div><div class="row"><span>Delivery</span><span>${o.zone==='inside'?'Inside':'Outside'} Dhaka</span></div><div class="row"><span>Payment</span><span>${o.pay}</span></div>${o.items.map(i=>`<div class="row"><span>${esc(i.n)} · ${i.color} · ${i.size} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="row tt"><span>TOTAL</span><span>${money(o.t)}</span></div></div><a class="btn" style="margin-top:20px" href="#/shop">Continue shopping</a></div>`}

/* ---------- ADMIN ---------- */
const STS=['pending','confirmed','processing','shipped','delivered','cancelled'],DED=['confirmed','processing','shipped','delivered'];
const pending=()=>OS.filter(o=>o.status==='pending').length;
function updBadge(){const c=pending(),t=c?`ADMIN (${c})`:'ADMIN';['#adm','#adm2'].forEach(s=>{const e=$(s);if(e)e.textContent=t});document.title=(c?`(${c}) `:'')+'Shafwan’s — Premium Streetwear'}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6)}catch(e){}}
function notify(o){beep();const n=$('#nt');n.innerHTML=`<b>🛍 New order ${esc(o.id)}</b><div style="opacity:.8;font-size:13px;margin-top:2px">${esc(o.name)} · ${money(o.t)} · ${(o.items||[]).reduce((a,i)=>a+i.qty,0)} item(s)</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" style="background:var(--inv);color:var(--ink);border-color:var(--inv)" data-act="goorders">View</button>${o.email?`<button class="btn sm o" style="color:var(--inv);border-color:var(--inv)" data-act="mail" data-id="${esc(o.id)}">Email customer</button>`:''}<button class="btn sm o" style="color:var(--inv);border-color:var(--inv)" data-act="dismiss">×</button></div>`;n.style.display='block';clearTimeout(nTm);nTm=setTimeout(()=>n.style.display='none',20000);try{if(window.Notification&&Notification.permission==='granted')new Notification('New order '+o.id,{body:o.name+' · '+money(o.t)})}catch(e){}}
function listen(){if(!owner||!db||listening)return;listening=true;db.collection('orders').onSnapshot(s=>{const first=!ready;OS=s.docs.flatMap(d=>Object.values((d.data()||{}).orders||{})).sort((a,b)=>b.at-a.at);ready=true;OS.forEach(o=>{if(!known.has(o.id)){known.add(o.id);if(!first)notify(o)}});updBadge();if(location.hash==='#/admin'&&tab==='orders')renderOrders()},()=>{listening=false})}
function orderCard(o){const fresh=o.status==='pending';return `<div class="oc ${fresh?'new':''}"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><b>${esc(o.id)} ${fresh?'<span class="chip ok">New</span>':''}</b><span>${new Date(o.at).toLocaleString('en-GB')}</span></div><p>${esc(o.name)} · <a href="tel:${esc(o.phone)}" style="text-decoration:underline">${esc(o.phone)}</a>${o.email?' · '+esc(o.email):''}<br>${esc(o.address)}, ${esc(o.area)} ${esc(o.district)}${o.notes?'<br><i>'+esc(o.notes)+'</i>':''}</p><p>${(o.items||[]).map(i=>`${esc(i.n)} · ${esc(i.color)} · ${esc(i.size)} × ${esc(i.qty)}`).join('<br>')}</p><p>Subtotal ${money(o.sub)} · Delivery ${money(o.f)} · Discount ${money(o.d)}${o.code?' ('+esc(o.code)+')':''} · <b>Total ${money(o.t)}</b> · ${esc(o.pay)}</p>
<div class="acts"><select data-act="status" data-id="${esc(o.id)}" aria-label="Status">${STS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>${o.email?`<button class="btn sm o" data-act="mail" data-id="${esc(o.id)}">${o.emailed?'✓ Emailed · resend':'Email confirmation'}</button>`:'<span class="chip">No email given</span>'}</div></div>`}
function renderOrders(){const st=$('#st');if(!st)return;const live=OS.filter(o=>o.status!=='cancelled'),td=new Date().toDateString();
st.innerHTML=`<div>Total sales<b>${money(live.reduce((a,o)=>a+o.t,0))}</b></div><div>Today<b>${money(live.filter(o=>new Date(o.at).toDateString()===td).reduce((a,o)=>a+o.t,0))}</b></div><div>Orders<b>${OS.length}</b></div><div>Pending<b>${pending()}</b></div>`;
const L=OS.filter(o=>fl==='all'||o.status===fl);$('#ol').innerHTML=!ready?'<p>Loading orders…</p>':L.map(orderCard).join('')||'<p>No orders here yet. New orders will appear instantly with an alert.</p>'}
function admin(){const A=$('#app');if(!owner){A.innerHTML=`<div class="w" style="padding:100px 0"><h1 style="font-size:36px">Restricted</h1><p style="color:var(--mut)">This area is only available to the store owner.</p><p style="color:var(--mut);font-size:13px">${esc(diag||'You are viewing the store as a customer. Open this page from your own claude.ai account (the account that published it) to see the admin panel.')}</p></div>`;return}
const tb=`<div class="tabs">${['orders','products','settings'].map(t=>`<button class="btn ${t===tab?'':'o'}" data-act="tab" data-v="${t}">${t}${t==='orders'&&pending()?' ('+pending()+')':''}</button>`).join('')}</div>`;
if(tab==='orders'){A.innerHTML=`<div class="w ad"><h1>Admin</h1>${tb}<div class="stats" id="st"></div><div class="acts" style="margin:0 0 14px"><select data-fl="1" aria-label="Filter">${['all',...STS].map(s=>`<option ${s===fl?'selected':''}>${s}</option>`).join('')}</select><button class="btn sm o" data-act="alerts">Enable desktop alerts</button></div><div id="ol"></div><p style="color:var(--mut);font-size:13px">Stock is deducted when an order moves out of Pending (Confirmed and onward) and returned if you cancel it. New orders play a sound and show an alert while this site is open.</p></div>`;renderOrders()}
else if(tab==='products'){A.innerHTML=`<div class="w ad"><h1>Admin</h1>${tb}<div class="savebar"><button class="btn" data-act="addp">Add product</button><button class="btn o" data-act="save">Save changes</button><span style="color:var(--mut);font-size:13px">Changes also auto-save.</span></div>${D.products.map((p,n)=>{const im=IMG[p.id]||[],sold=left(p)<1;return `<div class="pe"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px"><b>${esc(p.name)}</b><span><span class="chip ${p.avail===false?'no':'ok'}">${p.avail===false?'Unavailable':'Available'}</span> <span class="chip">${Object.values(p.stock).reduce((a,b)=>a+b,0)} in stock</span> <span class="chip">${p.active?'Visible':'Hidden'}</span></span></div>
<div class="top"><div><label>NAME</label><input data-p="products.${n}.name" value="${esc(p.name)}"></div><div><label>PRICE ৳</label><input type="number" min="0" data-t="n" data-p="products.${n}.price" value="${p.price}"></div><div><label>DISCOUNT %</label><input id="disc${n}" type="number" min="0" max="95" data-t="n" data-p="products.${n}.disc" value="${p.disc||''}" placeholder="0"></div><div><label>SALE PRICE ৳</label><input id="sale${n}" type="number" min="0" data-t="n" data-p="products.${n}.sale" value="${p.sale||''}" placeholder="none"></div><div><label>BADGE</label><select data-p="products.${n}.badge">${['none','new','sale','limited','featured'].map(b=>`<option ${b===p.badge?'selected':''}>${b}</option>`).join('')}</select></div></div>
<div class="t3"><div><label>AVAILABILITY</label><select data-t="b" data-p="products.${n}.avail"><option value="1" ${p.avail!==false?'selected':''}>Available — can be ordered</option><option value="0" ${p.avail===false?'selected':''}>Unavailable — shows Sold out</option></select></div><div><label>VISIBILITY</label><select data-t="b" data-p="products.${n}.active"><option value="1" ${p.active?'selected':''}>Visible in shop</option><option value="0" ${p.active?'':'selected'}>Hidden from shop</option></select></div><div><label>PHOTOS (UP TO 3)</label><input type="file" accept="image/*" multiple data-up="${p.id}" ${im.length>=3?'disabled':''}></div></div>
<div class="phr">${im.map((u,k)=>`<figure><img src="${u}" alt=""><button data-act="imgdel" data-id="${p.id}" data-i="${k}">Remove</button>${k?`<button data-act="imgfirst" data-id="${p.id}" data-i="${k}">Make main</button>`:'<div class="lbl" style="text-align:center;padding:4px">MAIN</div>'}</figure>`).join('')||'<span style="color:var(--mut);font-size:13px">No photos yet — a placeholder is shown in the shop.</span>'}</div>
${CLR.map(c=>`<div class="lbl" style="margin-top:10px">STOCK — ${c[0]} (S · M · L · XL · XXL)</div><div class="sg">${SZ.map(z=>`<input type="number" min="0" data-t="n" data-p="products.${n}.stock.${c[0]}_${z}" value="${p.stock[c[0]+'_'+z]||0}" title="${z}" aria-label="${c[0]} ${z}">`).join('')}</div>`).join('')}<button class="btn o sm" style="margin-top:12px" data-act="delp" data-i="${n}">Delete product</button></div>`}).join('')}</div>`}
else{A.innerHTML=`<div class="w ad"><h1>Admin</h1>${tb}<div class="savebar"><button class="btn" data-act="save">Save changes</button></div><div class="pe"><div class="top"><div><label>INSIDE DHAKA ৳</label><input type="number" data-t="n" data-p="settings.inside" value="${D.settings.inside}"></div><div><label>OUTSIDE DHAKA ৳</label><input type="number" data-t="n" data-p="settings.outside" value="${D.settings.outside}"></div><div><label>FREE DELIVERY OVER ৳</label><input type="number" data-t="n" data-p="settings.free" value="${D.settings.free||''}"></div></div><label style="margin-top:12px">ANNOUNCEMENT</label><input data-p="settings.ann" value="${esc(D.settings.ann)}"><label style="margin-top:12px">FOOTER TEXT</label><input data-p="settings.footer" value="${esc(D.settings.footer)}"></div>
<h3 style="margin:24px 0 8px">Size chart (cm)</h3><div class="pe">${D.sizes.map((r,n)=>`<div class="sg" style="grid-template-columns:50px repeat(4,1fr);align-items:center"><b>${r.s}</b>${['l','c','sh','sl'].map(k=>`<input type="number" data-t="n" data-p="sizes.${n}.${k}" value="${r[k]}" aria-label="${r.s} ${k}">`).join('')}</div>`).join('')}<p class="lbl">LENGTH · CHEST · SHOULDER · SLEEVE</p></div>
<h3 style="margin:24px 0 8px">Discount codes</h3>${D.codes.map((c,n)=>`<div class="pe"><div class="top"><div><label>CODE</label><input data-p="codes.${n}.code" value="${esc(c.code)}"></div><div><label>TYPE</label><select data-p="codes.${n}.type"><option value="percent" ${c.type==='percent'?'selected':''}>Percent</option><option value="fixed" ${c.type==='fixed'?'selected':''}>Fixed ৳</option></select></div><div><label>VALUE</label><input type="number" data-t="n" data-p="codes.${n}.value" value="${c.value}"></div><div><label>STATUS</label><select data-t="b" data-p="codes.${n}.active"><option value="1" ${c.active?'selected':''}>Active</option><option value="0" ${c.active?'':'selected'}>Disabled</option></select></div><div><label>&nbsp;</label><button class="btn o" style="min-height:48px" data-act="delc" data-i="${n}">Delete</button></div></div></div>`).join('')}<button class="btn o" data-act="addc">Add code</button></div>`}}
async function updOrder(o,u){const rf=db.doc('orders/'+o.uid),c=await rf.get(),m=(c.data()||{}).orders||{};m[o.id]=Object.assign(m[o.id]||o,u);await rf.set({uid:o.uid,orders:m});Object.assign(o,u)}
async function persist(msg){if(saving){clearTimeout(sv);sv=setTimeout(()=>persist(msg),500);return}saving=true;try{norm();await db.doc('store/config').set(D);flash(msg||'Saved')}catch(e){flash('Could not save')}saving=false}
const queueSave=()=>{clearTimeout(sv);sv=setTimeout(()=>persist(),900)};
const flash=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--inv);padding:12px 20px;z-index:99;font-size:13px';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
function fixDisc(n,src){const p=D.products[n];if(!p)return;if(src==='sale'){if(p.sale&&p.price&&p.sale<p.price)p.disc=Math.round((1-p.sale/p.price)*100);else{p.sale=null;p.disc=0}}else{p.disc=Math.min(95,p.disc||0);p.sale=p.disc>0?Math.round(p.price*(1-p.disc/100)):null}
const a=$('#sale'+n),b=$('#disc'+n);if(a)a.value=p.sale||'';if(b)b.value=p.disc||''}
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
async function saveImgs(id){try{await db.doc('images/'+id).set({list:IMG[id]||[]});flash('Photos saved')}catch(e){flash('Could not save photos (too large?)')}}
function mailOrder(o){const L=(o.items||[]).map(i=>`• ${i.n} (${i.color}, ${i.size}) × ${i.qty} — ${money(i.price*i.qty)}`).join('\n');
const body=`Hi ${o.name},\n\nThank you for shopping with Shafwan’s! We have received your order ${o.id}.\n\n${L}\n\nSubtotal: ${money(o.sub)}\nDelivery: ${o.f?money(o.f):'Free'}\nDiscount: −${money(o.d)}\nTotal to pay on delivery: ${money(o.t)}\n\nDelivery address: ${o.address}, ${o.area} ${o.district}\n\nWe will contact you on ${o.phone} to confirm your delivery.\n\nWith thanks,\nShafwan’s`;
return {to:o.email,subject:`Your Shafwan’s order ${o.id} has been placed`,body}}
const closeAll=()=>{$('#drawer').classList.remove('on');$('#modal').classList.remove('on');$('#ov').classList.remove('on')};
const act={close:closeAll,cart:()=>drawer(),size:()=>modal(sizeHtml()),size2:()=>modal(sizeHtml()+`<div style="padding:0 32px 32px"><button class="btn o" data-act="back">Back to product</button></div>`),back:()=>prod(),
open:t=>{const p=P(t.dataset.id);sel={id:p.id,color:CLR[0][0],size:'',qty:1,img:0};prod()},color:t=>{sel.color=t.dataset.v;if(sel.size&&stk(P(sel.id),sel.color,sel.size)<1)sel.size='';prod()},sz:t=>{sel.size=t.dataset.v;prod()},mq:t=>{sel.qty=Math.max(1,Math.min(10,sel.qty+ +t.dataset.v));prod()},timg:t=>{sel.img=+t.dataset.v;prod()},
add:()=>{if(addItem()){closeAll();drawer(true)}},buy:()=>{if(addItem()){closeAll();location.hash='#/checkout'}},
cq:t=>{const i=cart[t.dataset.i],p=P(i.pid),nq=i.qty+ +t.dataset.v;if(nq<1)cart.splice(t.dataset.i,1);else if(nq<=stk(p,i.color,i.size))i.qty=nq;saveCart();drawer()},rm:t=>{cart.splice(t.dataset.i,1);saveCart();drawer()},
tab:t=>{tab=t.dataset.v;admin()},save:()=>{clearTimeout(sv);persist()},addp:()=>{D.products.unshift(mk('new-'+Date.now(),'New Hoodie',3000));persist('Product added').then(admin)},
delp:t=>{if(confirm('Delete this product?')){const p=D.products[t.dataset.i];D.products.splice(t.dataset.i,1);delete IMG[p.id];db.doc('images/'+p.id).delete().catch(()=>{});persist('Deleted').then(admin)}},
addc:()=>{D.codes.push({code:'NEWCODE',type:'percent',value:10,active:true});admin();queueSave()},delc:t=>{D.codes.splice(t.dataset.i,1);admin();queueSave()},
imgdel:async t=>{const id=t.dataset.id;(IMG[id]=IMG[id]||[]).splice(+t.dataset.i,1);await saveImgs(id);admin()},
imgfirst:async t=>{const id=t.dataset.id,[x]=IMG[id].splice(+t.dataset.i,1);IMG[id].unshift(x);await saveImgs(id);admin()},
goorders:()=>{$('#nt').style.display='none';tab='orders';fl='all';location.hash==='#/admin'?admin():location.hash='#/admin'},dismiss:()=>{$('#nt').style.display='none'},
alerts:()=>{try{Notification.requestPermission().then(r=>flash(r==='granted'?'Desktop alerts on':'Alerts blocked by browser'))}catch(e){flash('Not supported here')}},
mail:async t=>{const o=OS.find(x=>x.id===t.dataset.id);if(!o||!o.email)return;const m=mailOrder(o),u=`mailto:${encodeURIComponent(m.to)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
try{await navigator.clipboard.writeText(`To: ${m.to}\nSubject: ${m.subject}\n\n${m.body}`);flash('Email text copied')}catch(e){}
window.open(u,'_blank');try{await updOrder(o,{emailed:true});renderOrders()}catch(e){}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&act[t.dataset.act]){if(t.tagName==='A'&&t.hasAttribute('href')&&t.dataset.act!=='close')return;act[t.dataset.act](t,e)}});
document.addEventListener('change',async e=>{const t=e.target;
if(t.dataset.fl){fl=t.value;renderOrders();return}
if(t.dataset.up){const id=t.dataset.up,list=IMG[id]=IMG[id]||[];flash('Processing photos…');try{for(const f of [...t.files]){if(list.length>=3)break;list.push(await shrink(f))}
if(list.join('').length>230000){list.length=Math.max(0,list.length-1);flash('Photos too large — try smaller images')}await saveImgs(id)}catch(x){flash('Could not read that image')}admin();return}
if(t.dataset.act==='status'){const o=OS.find(x=>x.id===t.dataset.id);if(!o)return;const upd={status:t.value};let ch=false;
if(DED.includes(t.value)&&!o.ded){o.items.forEach(i=>{const p=P(i.pid);if(p){const k=i.color+'_'+i.size;p.stock[k]=Math.max(0,(p.stock[k]||0)-i.qty)}});upd.ded=true;ch=true}
else if(t.value==='cancelled'&&o.ded){o.items.forEach(i=>{const p=P(i.pid);if(p){const k=i.color+'_'+i.size;p.stock[k]=(p.stock[k]||0)+i.qty}});upd.ded=false;ch=true}
try{await updOrder(o,upd);if(ch)await persist('Status updated, stock adjusted');else flash('Status updated')}catch(x){flash('Could not update')}return}
if(t.dataset.p){const ks=t.dataset.p.split('.');let o=D;ks.slice(0,-1).forEach(k=>o=o[k]);let v=t.value;if(t.dataset.t==='n')v=v===''?null:Math.max(0,+v);if(t.dataset.t==='b')v=v==='1';o[ks.at(-1)]=v;
if(ks[0]==='products'&&['price','disc','sale'].includes(ks[2]))fixDisc(+ks[1],ks[2]);queueSave()}});
function route(){const h=location.hash.replace('#/','');closeAll();window.scrollTo(0,0);
if(h==='checkout')checkout();else if(h==='done')done();else if(h==='admin')admin();else{home();if(h==='shop'||h==='about')setTimeout(()=>$('#'+h)?.scrollIntoView(),30)}}
addEventListener('hashchange',route);chrome();saveCart();route();
const showAdm=()=>['#adm','#adm2'].forEach(x=>{const e=$(x);if(e)e.hidden=!owner});
(async()=>{try{if(!window.claude){diag='This page is not running inside the Claude viewer. Open the published claude.ai link instead of the raw file.';return}
let u=null;try{u=await claude.use('user')}catch(e){}
if(u){try{owner=!!((await u.isOwner())||(await u.canEdit()))}catch(e){}try{uid=await u.id()}catch(e){}}
else diag='Could not identify you. Sign in to claude.ai in this browser, then reload.';
if(u&&!owner)diag='You are signed in, but this account is not the owner or an editor of this page.';
showAdm();if(location.hash==='#/admin')admin();
db=await claude.use('db');if(!db){if(!diag)diag='The database is unavailable. Sign in to claude.ai and reload.';return}
try{const s=await db.doc('store/config').get();if(s.exists){D=Object.assign(D,s.data());norm();cart=cart.filter(i=>P(i.pid));chrome();saveCart()}}catch(e){}
try{(await db.collection('images').get()).docs.forEach(d=>IMG[d.id]=(d.data()||{}).list||[])}catch(e){}
if(owner)listen();route()}catch(e){}})();
</script></body></html>
